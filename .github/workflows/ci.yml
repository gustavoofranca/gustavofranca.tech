name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    # Chave pública de teste do Turnstile (sempre passa): o build exige uma chave, e o
    # e2e roda com as variáveis do webServer do playwright.config.ts.
    env:
      PUBLIC_TURNSTILE_SITEKEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Conferências do build que não precisam de navegador: CSP de cada página, glifos das
      # fontes subconjunto e JS da home.
      - run: npm run audit:dist
      - run: npm run audit:fonts
      - run: npm run budget
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      # Lighthouse sobre dist/client com compressão (lighthouserc.json); orçamento em
      # .claude/rules/qualidade.md.
      - run: npm run lhci

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Produção sem nenhum alerta alto; ferramentas de CI só com exceção listada e
      # dentro do prazo (audit-allowlist.json). scripts/audit-deps.mjs
      - run: npm run audit:deps
