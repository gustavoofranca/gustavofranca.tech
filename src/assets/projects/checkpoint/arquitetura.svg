    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#09090b"/>
  <rect x="30" y="195" width="150" height="80" rx="10" fill="#131316" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="105" y="231" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#fafafa" text-anchor="middle">Client</text>
  <text x="105" y="253" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#a1a1aa" text-anchor="middle">HTTP · JSON</text>
  <rect x="240" y="185" width="190" height="100" rx="10" fill="#131316" stroke="#a78bfa" stroke-width="1.5"/>
