<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Arquitetura do Checkpoint</title>
  <desc id="descricao">O cliente chama a API NestJS, que lê o PostgreSQL pelo Prisma e usa o Redis para cache, limite de requisições e fila. Um worker separado consome a fila BullMQ, busca os dados na loja da Steam e grava no PostgreSQL.</desc>
