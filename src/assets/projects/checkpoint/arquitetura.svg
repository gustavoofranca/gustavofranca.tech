  <text x="335" y="277" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#a1a1aa" text-anchor="middle">Problem Details</text>
  <rect x="500" y="40" width="200" height="90" rx="10" fill="#131316" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="600" y="71" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#fafafa" text-anchor="middle">Redis</text>
