<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Arquitetura do Lumina Influence AI</title>
  <desc id="descricao">O navegador acessa o Caddy, no VPS, que serve o front-end React e repassa a API Flask. A API e o worker de jobs usam o PostgreSQL no Supabase e chamam o Gemini, as APIs sociais e os provedores de OAuth.</desc>
